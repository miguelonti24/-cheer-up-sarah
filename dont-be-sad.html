    /* Confetti canvas */
    #confetti-canvas {
      position: fixed;
      top: 0; left: 0;
      width: 100%; height: 100%;
      pointer-events: none;
      z-index: 10;
    }

    /* Floating hearts background */
    .hearts-container {
      position: fixed;
      top: 0; left: 0;
      width: 100%; height: 100%;
      pointer-events: none;
      z-index: 0;
    }

    .heart {
      position: absolute;
      bottom: -50px;
      animation: floatUp linear infinite;
      opacity: 0;
    }

    @keyframes floatUp {
      0%   { transform: translateY(0) rotate(0deg); opacity: 0.8; }
      100% { transform: translateY(-110vh) rotate(20deg); opacity: 0; }
    }

    /* Main card */
    .card {
      position: relative;
      z-index: 1;
      background: rgba(255, 255, 255, 0.15);
      backdrop-filter: blur(4px);
      border-radius: 32px;
      padding: 48px 56px;
      text-align: center;
      box-shadow: 0 8px 40px rgba(180, 80, 150, 0.4);
      max-width: 480px;
      width: 90%;
    }

    /* Speech bubble */
    .bubble {
      background: white;
      border: 3px solid #f9a8d4;
      border-radius: 20px;
      padding: 14px 24px;
      font-size: 1.4rem;
      font-weight: 700;
      color: #be185d;
      margin-bottom: 12px;
      position: relative;
      animation: popIn 0.6s cubic-bezier(0.68,-0.55,0.27,1.55) both;
      display: inline-block;
    }

    .bubble::after {
      content: '';
      position: absolute;
      bottom: -18px;
      left: 50%;
      transform: translateX(-50%);
      border: 10px solid transparent;
      border-top-color: #f9a8d4;
    }

    .bubble::before {
      content: '';
      position: absolute;
      bottom: -13px;
      left: 50%;
      transform: translateX(-50%);
      border: 9px solid transparent;
      border-top-color: white;
      z-index: 1;
    }

    @keyframes popIn {
      0%   { transform: scale(0); opacity: 0; }
      100% { transform: scale(1); opacity: 1; }
    }

    /* Sylveon sprite — clickable */
    .sylveon-wrap {
      margin-top: 24px;
      cursor: pointer;
      position: relative;
      display: inline-block;
      animation: bounce 1.8s ease-in-out infinite;
      transition: transform 0.1s;
      user-select: none;
    }

    .sylveon-wrap:active {
      transform: scale(0.92);
    }

    .sylveon-wrap img {
      width: 160px;
      image-rendering: pixelated;
      filter: drop-shadow(0 6px 16px rgba(255, 100, 180, 0.4));
      animation: wiggle 3s ease-in-out infinite;
    }

    @keyframes bounce {
      0%, 100% { transform: translateY(0); }
      50%       { transform: translateY(-18px); }
    }

    @keyframes wiggle {
      0%, 100% { transform: rotate(0deg); }
      25%       { transform: rotate(-3deg); }
      75%       { transform: rotate(3deg); }
    }

    /* Click hint */
    .click-hint {
      font-size: 0.75rem;
      color: #f472b6;
      margin-top: 6px;
      animation: pulse 2s ease-in-out infinite;
    }

    @keyframes pulse {
      0%, 100% { opacity: 0.5; }
      50%       { opacity: 1; }
    }

    /* Subtitle */
    .subtitle {
      margin-top: 20px;
      font-size: 1rem;
      color: #9d174d;
      line-height: 1.6;
      animation: fadeIn 1.2s 0.5s both;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(10px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    /* Mobile */
    @media (max-width: 480px) {
      .card { padding: 32px 24px; }
      .bubble { font-size: 1.1rem; padding: 12px 18px; }
      .sylveon-wrap img { width: 120px; }
      .hug-btn { font-size: 1rem; padding: 12px 24px; }
      .subtitle { font-size: 0.9rem; }
    }

    /* Hug button */
    .hug-btn {
      margin-top: 24px;
      padding: 14px 32px;
      background: linear-gradient(135deg, #f9a8d4, #a5b4fc);
      border: none;
      border-radius: 50px;
      font-size: 1.1rem;
      font-weight: 700;
      color: white;
      cursor: pointer;
      animation: fadeIn 1.4s 0.8s both;
      box-shadow: 0 4px 20px rgba(249, 168, 212, 0.5);
      transition: transform 0.15s, box-shadow 0.15s;
    }

    .hug-btn:hover {
      transform: scale(1.06);
      box-shadow: 0 6px 28px rgba(249, 168, 212, 0.7);
    }

    .hug-btn:active {
      transform: scale(0.96);
    }

    /* Hug message that appears */
    .hug-msg {
      margin-top: 16px;
      font-size: 1.05rem;
      color: #be185d;
      font-weight: 600;
      min-height: 28px;
      animation: fadeIn 0.4s both;
    }

    /* Burst hearts from Sylveon click */
    .burst-heart {
      position: fixed;
      font-size: 1.4rem;
      pointer-events: none;
      z-index: 20;
      animation: burstOut 0.9s ease-out forwards;
    }

    @keyframes burstOut {
      0%   { transform: translate(0,0) scale(0.5); opacity: 1; }
      100% { transform: translate(var(--tx), var(--ty)) scale(1.3); opacity: 0; }
    }

    /* Sparkles */
    .sparkle {
      position: absolute;
      font-size: 1.2rem;
      animation: sparkleAnim 2s ease-in-out infinite;
    }
    .sparkle:nth-child(1) { top: 12%; left: 8%;  animation-delay: 0s; }
    .sparkle:nth-child(2) { top: 20%; right: 10%; animation-delay: 0.5s; }
    .sparkle:nth-child(3) { bottom: 18%; left: 12%; animation-delay: 1s; }
    .sparkle:nth-child(4) { bottom: 12%; right: 8%; animation-delay: 1.5s; }

    @keyframes sparkleAnim {
      0%, 100% { transform: scale(1) rotate(0deg); opacity: 0.7; }
      50%       { transform: scale(1.4) rotate(20deg); opacity: 1; }
    }88%  { transform: translateX(calc(100vw + 320px)); opacity: 1; }
      89%  { transform: translateX(calc(100vw + 320px)); opacity: 0; }
      90%  { transform: translateX(0); opacity: 0; }
      91%  { transform: translateX(0); opacity: 1; }
      100% { transform: translateX(calc(100vw + 320px)); opacity: 1; }
    }

    /* Typewriter cursor */
    .bubble .cursor {
      display: inline-block;
      width: 2px;
      background: #be185d;
      margin-left: 2px;
      animation: blink 0.7s step-end infinite;
      vertical-align: middle;
      height: 1.2em;
    }

    @keyframes blink {
      0%, 100% { opacity: 1; }
      50%       { opacity: 0; }
    }

    /* Secret image overlay */
    .secret-overlay {
      display: none;
      position: fixed;
      inset: 0;
      z-index: 100;
      background: rgba(0, 0, 0, 0.85);
      align-items: center;
      justify-content: center;
      padding: 24px;
      opacity: 0;
      transition: opacity 0.8s ease;
    }

    .secret-overlay.show {
      display: flex;
    }

    .secret-overlay.visible {
      opacity: 1;
    }

    .secret-card {
      position: relative;
      max-width: 380px;
      width: 100%;
      border-radius: 28px;
      overflow: hidden;
      box-shadow: 0 20px 60px rgba(0, 0, 0, 0.5);
      transform: scale(0.85);
      transition: transform 0.6s cubic-bezier(0.34, 1.56, 0.64, 1);
    }

    .secret-overlay.visible .secret-card {
      transform: scale(1);
    }

    .secret-card img {
      width: 100%;
      display: block;
      object-fit: cover;
    }

    .secret-caption {
      position: absolute;
      bottom: 0;
      left: 0;
      right: 0;
      padding: 20px;
      background: linear-gradient(transparent, rgba(0,0,0,0.55));
      color: white;
      font-size: 1rem;
      font-weight: 600;
      text-align: center;
      letter-spacing: 0.3px;
    }

    @media (max-width: 480px) {
      .secret-card { border-radius: 20px; }
      .secret-caption { font-size: 0.9rem; padding: 16px; }
    }
      to   { opacity: 0; }
    }
  </style>
</head>
<body>

  <canvas id="confetti-canvas"></canvas>
  <div class="hearts-container" id="hearts"></div>
<div class="card">
    <span class="sparkle">✨</span>
    <span class="sparkle">💫</span>
    <span class="sparkle">🌸</span>
    <span class="sparkle">🌸</span>

    <div class="bubble" id="bubble"><span id="bubbleText"></span><span class="cursor" id="cursor"></span></div>

    <div class="sylveon-wrap" id="sylveon" title="Click me!">
      <img
        src="https://play.pokemonshowdown.com/sprites/gen6ani/sylveon.gif"
        alt="Sylveon"
        onerror="this.src='https://raw.githubusercontent.com/PokeAPI/sprites/master/sprites/pokemon/700.png'"
      />
    </div>
    <div class="click-hint">tap Sylveon for a surprise</div>

    <p class="subtitle">
      Cheer up, sad doesn't suit you
    </p>

    <button class="hug-btn" id="hugBtn">okay fine, hug 🤗</button>
    <div class="hug-msg" id="hugMsg"></div>
  </div>

  <script>
    // ── Floating background hearts ──────────────────────────────
    const container = document.getElementById('hearts');
    const bgEmojis = ['🌸', '✨', '🎀', '🌸', '✨'];
    for (let i = 0; i < 20; i++) {
      const el = document.createElement('span');
      el.classList.add('heart');
      el.textContent = bgEmojis[Math.floor(Math.random() * bgEmojis.length)];
      el.style.left = Math.random() * 100 + 'vw';
      el.style.fontSize = (Math.random() * 1.2 + 0.8) + 'rem';
      el.style.animationDuration = (Math.random() * 6 + 6) + 's';
      el.style.animationDelay = (Math.random() * 8) + 's';
      container.appendChild(el);
    }

    // ── Confetti on load ────────────────────────────────────────
    const canvas = document.getElementById('confetti-canvas');
    const ctx = canvas.getContext('2d');
    canvas.width = window.innerWidth;
    canvas.height = window.innerHeight;

    const colors = ['#f9a8d4','#a5b4fc','#fde68a','#86efac','#fb7185','#67e8f9'];
    const pieces = Array.from({length: 120}, () => ({
      x: Math.random() * canvas.width,
      y: Math.random() * -canvas.height,
      r: Math.random() * 7 + 4,
      color: colors[Math.floor(Math.random() * colors.length)],
      speed: Math.random() * 3 + 2,
      angle: Math.random() * Math.PI * 2,
      spin: (Math.random() - 0.5) * 0.2,
      shape: Math.random() > 0.5 ? 'rect' : 'circle'
    }));

    let confettiActive = true;
    let confettiFrames = 0;

    function drawConfetti() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      pieces.forEach(p => {
        p.y += p.speed;
        p.angle += p.spin;
        ctx.save();
        ctx.translate(p.x, p.y);
        ctx.rotate(p.angle);
        ctx.fillStyle = p.color;
        if (p.shape === 'rect') {
          ctx.fillRect(-p.r, -p.r / 2, p.r * 2, p.r);
        } else {
          ctx.beginPath();
          ctx.arc(0, 0, p.r / 2, 0, Math.PI * 2);
          ctx.fill();
        }
        ctx.restore();
      });
      confettiFrames++;
      if (confettiFrames < 180) {
        requestAnimationFrame(drawConfetti);
      } else {
        ctx.clearRect(0, 0, canvas.width, canvas.height);
      }
    }
    drawConfetti();

    // ── Click Sylveon → burst hearts ───────────────────────────
    const sylveon = document.getElementById('sylveon');
    const burstEmojis = ['🌸','✨','🎀','🌸','✨','🎀'];

    sylveon.addEventListener('click', (e) => {
      const rect = sylveon.getBoundingClientRect();
      const cx = rect.left + rect.width / 2;
      const cy = rect.top + rect.height / 2;

      for (let i = 0; i < 12; i++) {
        const el = document.createElement('span');
        el.classList.add('burst-heart');
        el.textContent = burstEmojis[Math.floor(Math.random() * burstEmojis.length)];
        const angle = (i / 12) * Math.PI * 2;
        const dist = 80 + Math.random() * 60;
        el.style.left = cx + 'px';
        el.style.top  = cy + 'px';
        el.style.setProperty('--tx', Math.cos(angle) * dist + 'px');
        el.style.setProperty('--ty', Math.sin(angle) * dist + 'px');
        document.body.appendChild(el);
        setTimeout(() => el.remove(), 900);
      }
    });

    // ── Send a hug button ───────────────────────────────────────
    const hugBtn  = document.getElementById('hugBtn');
    const hugMsg  = document.getElementById('hugMsg');
    const hugMessages = [
      "Okay fine, here's a hug. Don't make it weird",
      "Smile. That's an order",
      "Whatever it is, it's not worth it",
      "You're too cool to be this sad rn",
      "There she is",
      "See? Already better",
      "Told you it would work",
      "That's more like it",
      "You'll be good, trust",
      "Keep going, you got this",
    ];
    let hugIndex = 0;

    hugBtn.addEventListener('click', () => {
      hugMsg.style.animation = 'none';
      hugMsg.offsetHeight; // reflow
      hugMsg.style.animation = 'fadeIn 0.4s both';
      hugMsg.textContent = hugMessages[hugIndex % hugMessages.length];
      hugIndex++;

      if (hugIndex === 16) {
        const overlay = document.getElementById('secretOverlay');
        overlay.classList.add('show');
        requestAnimationFrame(() => {
          requestAnimationFrame(() => overlay.classList.add('visible'));
        });
        setTimeout(() => {
          overlay.classList.remove('visible');
          setTimeout(() => overlay.classList.remove('show'), 800);
        }, 7000);
      }

      // mini confetti burst
      confettiFrames = 0;
      pieces.forEach(p => { p.y = Math.random() * -canvas.height; });
      drawConfetti();
    });

    window.addEventListener('resize', () => {
      canvas.width  = window.innerWidth;
      canvas.height = window.innerHeight;
    });

    // Typewriter effect on bubble
    const bubbleText = document.getElementById('bubbleText');
    const cursor = document.getElementById('cursor');
    const message = 'No sad vibes allowed, Sarah 😤';
    let charIndex = 0;

    function typeWriter() {
      if (charIndex < message.length) {
        bubbleText.textContent += message[charIndex];
        charIndex++;
        setTimeout(typeWriter, 60);
      } else {
        setTimeout(() => { cursor.style.display = 'none'; }, 1000);
      }
    }

    setTimeout(typeWriter, 600);

  </script>
