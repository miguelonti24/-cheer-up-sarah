#confetti-canvas { position:fixed; top:0; left:0; width:100%; height:100%; pointer-events:none; z-index:10; }
.hearts-container { position:fixed; top:0; left:0; width:100%; height:100%; pointer-events:none; z-index:0; }
.heart { position:absolute; bottom:-50px; animation:floatUp linear infinite; opacity:0; }
@keyframes floatUp { 0%{opacity:.8;transform:translateY(0)} 100%{opacity:0;transform:translateY(-110vh)} }
.card { position:relative; z-index:1; background:rgba(255,255,255,0.15); backdrop-filter:blur(4px); border-radius:32px; padding:48px 56px; text-align:center; box-shadow:0 8px 40px rgba(180,80,150,0.4); max-width:480px; width:90%; }
.sparkle { position:absolute; font-size:1.2rem; animation:sparkleAnim 2s ease-in-out infinite; }
.sparkle:nth-child(1){top:12%;left:8%;animation-delay:0s}
.sparkle:nth-child(2){top:20%;right:10%;animation-delay:.5s}
.sparkle:nth-child(3){bottom:18%;left:12%;animation-delay:1s}
.sparkle:nth-child(4){bottom:12%;right:8%;animation-delay:1.5s}
@keyframes sparkleAnim{0%,100%{transform:scale(1) rotate(0);opacity:.7}50%{transform:scale(1.4) rotate(20deg);opacity:1}}
.bubble { background:white; border:3px solid #f9a8d4; border-radius:20px; padding:14px 24px; font-size:1.4rem; font-weight:700; color:#be185d; margin-bottom:12px; position:relative; display:inline-block; animation:popIn .6s cubic-bezier(.68,-.55,.27,1.55) both; }
.bubble::after { content:""; position:absolute; bottom:-18px; left:50%; transform:translateX(-50%); border:10px solid transparent; border-top-color:#f9a8d4; }
.bubble::before { content:""; position:absolute; bottom:-13px; left:50%; transform:translateX(-50%); border:9px solid transparent; border-top-color:white; z-index:1; }
@keyframes popIn{0%{transform:scale(0);opacity:0}100%{transform:scale(1);opacity:1}}
.sylveon-wrap { margin-top:24px; cursor:pointer; display:inline-block; user-select:none; animation:bounce 1.8s ease-in-out infinite; }
.sylveon-wrap img { width:160px; image-rendering:pixelated; filter:drop-shadow(0 6px 16px rgba(255,100,180,.4)); animation:wiggle 3s ease-in-out infinite; }
@keyframes bounce{0%,100%{transform:translateY(0)}50%{transform:translateY(-18px)}}
@keyframes wiggle{0%,100%{transform:rotate(0)}25%{transform:rotate(-3deg)}75%{transform:rotate(3deg)}}
.click-hint { font-size:.75rem; color:#f472b6; margin-top:6px; animation:pulse 2s ease-in-out infinite; }
@keyframes pulse{0%,100%{opacity:.5}50%{opacity:1}}
.subtitle { margin-top:20px; font-size:1rem; color:#9d174d; line-height:1.6; animation:fadeIn 1.2s .5s both; }
@keyframes fadeIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}
.hug-btn { margin-top:24px; padding:14px 32px; background:linear-gradient(135deg,#f9a8d4,#a5b4fc); border:none; border-radius:50px; font-size:1.1rem; font-weight:700; color:white; cursor:pointer; animation:fadeIn 1.4s .8s both; box-shadow:0 4px 20px rgba(249,168,212,.5); transition:transform .15s; }
.hug-btn:hover{transform:scale(1.06)}.hug-btn:active{transform:scale(.96)}
.hug-msg { margin-top:16px; font-size:1.05rem; color:#9d174d; font-weight:600; min-height:28px; }
.burst-heart { position:fixed; font-size:1.4rem; pointer-events:none; z-index:20; animation:burstOut .9s ease-out forwards; }
@keyframes burstOut{0%{transform:translate(0,0) scale(.5);opacity:1}100%{transform:translate(var(--tx),var(--ty)) scale(1.3);opacity:0}}
.cursor { display:inline-block; width:2px; background:#be185d; margin-left:2px; vertical-align:middle; height:1.2em; animation:blink .7s step-end infinite; }
@keyframes blink{0%,100%{opacity:1}50%{opacity:0}}
#secret-overlay { display:none; position:fixed; top:0; left:0; width:100%; height:100%; z-index:9999; background:rgba(0,0,0,0.88); align-items:center; justify-content:center; padding:24px; }
.secret-card { position:relative; max-width:380px; width:100%; border-radius:28px; overflow:hidden; box-shadow:0 20px 60px rgba(0,0,0,.5); }
.secret-card img { width:100%; display:block; }
.secret-caption { position:absolute; bottom:0; left:0; right:0; padding:20px; background:linear-gradient(transparent,rgba(0,0,0,.6)); border-radius:0 0 28px 28px; text-align:center; font-size:.9rem; font-style:italic; color:white; line-height:1.5; }
@media(max-width:480px){.card{padding:32px 24px}.bubble{font-size:1.1rem;padding:12px 18px}.sylveon-wrap img{width:120px}.hug-btn{font-size:1rem;padding:12px 24px}.subtitle{font-size:.9rem}}
</style>
</head>

<script>
var emojis = ["🌸","✨","🎀"];
var hc = document.getElementById("hearts");
for (var i = 0; i < 20; i++) {
  var el = document.createElement("span");
  el.className = "heart";
  el.textContent = emojis[Math.floor(Math.random() * emojis.length)];
  el.style.left = Math.random() * 100 + "vw";
  el.style.fontSize = (Math.random() * 1.2 + 0.8) + "rem";
  el.style.animationDuration = (Math.random() * 6 + 6) + "s";
  el.style.animationDelay = (Math.random() * 8) + "s";
  hc.appendChild(el);
}
var canvas = document.getElementById("confetti-canvas");
var ctx = canvas.getContext("2d");
canvas.width = window.innerWidth; canvas.height = window.innerHeight;
var colors = ["#f9a8d4","#a5b4fc","#fde68a","#86efac","#fb7185","#67e8f9"];
var pieces = [];
for (var i = 0; i < 120; i++) { pieces.push({ x:Math.random()*canvas.width, y:Math.random()*-canvas.height, r:Math.random()*7+4, color:colors[Math.floor(Math.random()*colors.length)], speed:Math.random()*3+2, angle:Math.random()*Math.PI*2, spin:(Math.random()-.5)*.2, shape:Math.random()>.5?"rect":"circle" }); }
var confettiFrames = 0;
function drawConfetti() {
  ctx.clearRect(0,0,canvas.width,canvas.height);
  pieces.forEach(function(p){ p.y+=p.speed; p.angle+=p.spin; ctx.save(); ctx.translate(p.x,p.y); ctx.rotate(p.angle); ctx.fillStyle=p.color; if(p.shape==="rect"){ctx.fillRect(-p.r,-p.r/2,p.r*2,p.r);}else{ctx.beginPath();ctx.arc(0,0,p.r/2,0,Math.PI*2);ctx.fill();} ctx.restore(); });
  confettiFrames++;
  if(confettiFrames<180) requestAnimationFrame(drawConfetti); else ctx.clearRect(0,0,canvas.width,canvas.height);
}
drawConfetti();
document.getElementById("sylveon").addEventListener("click", function(){
  var rect=this.getBoundingClientRect(), cx=rect.left+rect.width/2, cy=rect.top+rect.height/2;
  for(var i=0;i<12;i++){ (function(idx){ var el=document.createElement("span"); el.className="burst-heart"; el.textContent=emojis[Math.floor(Math.random()*emojis.length)]; var ang=(idx/12)*Math.PI*2, dist=80+Math.random()*60; el.style.left=cx+"px"; el.style.top=cy+"px"; el.style.setProperty("--tx",Math.cos(ang)*dist+"px"); el.style.setProperty("--ty",Math.sin(ang)*dist+"px"); document.body.appendChild(el); setTimeout(function(){if(el.parentNode)el.parentNode.removeChild(el);},900); })(i); }
});
var hugMessages = ["Okay fine, here's a hug. Don't make it weird","Smile. That's an order","Whatever it is, it's not worth it","You're too cool to be this sad rn","There she is","See? Already better","Told you it would work","That's more like it","You'll be good, trust","Keep going, you got this"];
var hugIndex = 0;
var overlay = document.getElementById("secret-overlay");
document.getElementById("hugBtn").addEventListener("click", function(){
  document.getElementById("hugMsg").textContent = hugMessages[hugIndex % hugMessages.length];
  hugIndex++;
  confettiFrames = 0; pieces.forEach(function(p){ p.y = Math.random() * -canvas.height; }); drawConfetti();
  if (hugIndex % 10 === 0) {
    overlay.style.display = "flex";
    setTimeout(function(){ overlay.style.display = "none"; }, 8000);
  }
});
var bt=document.getElementById("bubbleText"), cur=document.getElementById("cursor");
var msg="No sad vibes allowed, Sarah 😤", ci=0;
function tw(){ if(ci<msg.length){bt.textContent+=msg[ci];ci++;setTimeout(tw,60);}else{setTimeout(function(){cur.style.display="none";},1000);} }
setTimeout(tw, 600);
window.addEventListener("resize", function(){ canvas.width=window.innerWidth; canvas.height=window.innerHeight; });
</script>
